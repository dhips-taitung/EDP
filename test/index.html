<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>地震防災系統</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #d35400;
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --google-purple: #673ab7;
        }

        body, html {
            font-family: "Microsoft JhengHei", -apple-system, sans-serif;
            margin: 0; padding: 0;
            background-color: var(--bg-color);
        }

        /* 導覽列 */
        .nav-tabs {
            display: flex; background: var(--primary-color);
            position: sticky; top: 0; z-index: 2000;
        }

        .tab-btn {
            flex: 1; padding: 16px 5px; border: none; background: none;
            color: #bdc3c7; font-size: 16px; font-weight: bold; cursor: pointer;
        }

        .tab-btn.active { color: white; background: rgba(255,255,255,0.15); border-bottom: 4px solid #3498db; }

        .content-section { display: none; padding: 15px; max-width: 1200px; margin: 0 auto; }
        .content-section.active { display: block; }

        /* 統計卡片 */
        .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 15px; }
        .summary-card { background: var(--card-bg); padding: 12px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: center; border-top: 4px solid #3498db; }
        .summary-card.highlight { border-top-color: #e74c3c; }
        .summary-label { font-size: 12px; color: #7f8c8d; margin-bottom: 5px; font-weight: bold; }
        .summary-value { font-size: 22px; font-weight: bold; color: var(--primary-color); }

        .btn-refresh { width: 100%; padding: 12px; background: #27ae60; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; margin-bottom: 15px; cursor: pointer; }

        /* --- 表格自定義優化 (關鍵修改) --- */
        .table-container { 
            background: white; 
            border-radius: 10px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.08); 
            width: 100%;
            overflow-x: hidden; /* 防止產生水平捲軸 */
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            table-layout: fixed; /* 固定寬度佈局，強制欄位平分 */
        }

        th, td { 
            border: 1px solid #edf2f7; 
            padding: 8px 2px; 
            text-align: center; 
            font-size: 14px; 
            word-break: break-all; /* 長字強制換行 */
        }

        th { background-color: #f8fafc; color: #34495e; }

        /* 手機端專用調整：確保 9 個欄位並列 */
        @media (max-width: 600px) {
            th, td { 
                font-size: 11px; /* 縮小字體 */
                padding: 4px 1px; 
            }
            .summary-value { font-size: 18px; }
            /* 針對「名單」欄位可稍微寬一點點，其餘數字欄位壓縮 */
            th:nth-child(1) { width: 14%; } /* 班級 */
            th:nth-child(9) { width: 18%; } /* 名單 */
        }

        /* 表單設計... (保留之前設計) */
        .custom-form { max-width: 600px; margin: 0 auto; }
        .form-card { background: white; border: 1px solid #dadce0; border-radius: 8px; padding: 20px; margin-bottom: 10px; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 10px 0; border: none; border-bottom: 1px solid #dadce0; font-size: 16px; outline: none; }
        .btn-submit { background-color: #673ab7; color: white; padding: 12px; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; }
        #loading-text { text-align: center; padding: 10px; color: #95a5a6; display: none; }
    </style>
</head>
<body>

    <div class="nav-tabs">
        <button id="tab-report-btn" class="tab-btn active" onclick="openTab('report')">📊 防災統計回報</button>
        <button id="tab-form-btn" class="tab-btn" onclick="openTab('form')">📝 表單填寫</button>
    </div>

    <!-- 分頁 1: 統計回報 -->
    <div id="report" class="content-section active">
        <button class="btn-refresh" onclick="fetchSheetData()">🔄 更新最新統計資料</button>
        <div id="loading-text">⚡ 正在即時抓取即時數據...</div>
        
        <div class="summary-grid">
            <div class="summary-card"><div class="summary-label">全校應到人數</div><div id="j3-val" class="summary-value">-</div></div>
            <div class="summary-card"><div class="summary-label">已請假人數</div><div id="j5-val" class="summary-value" style="color: #c0392b;">-</div></div>
            <div class="summary-card highlight"><div class="summary-label">未到校人數</div><div id="j7-val" class="summary-value" style="color: #c0392b;">-</div></div>
            <div class="summary-card"><div class="summary-label">全校實到人數</div><div id="j9-val" class="summary-value">-</div></div>
            <div class="summary-card highlight"><div class="summary-label">失蹤人數</div><div id="j11-val" class="summary-value" style="color: #c0392b;">-</div></div>
        </div>

        <div class="table-container">
            <table><thead id="table-head"></thead><tbody id="table-body"></tbody></table>
        </div>
    </div>

    <!-- 分頁 2: 表單填寫 -->
    <div id="form" class="content-section">
        <div class="custom-form">
            <div class="form-card"><div style="font-size: 24px;">地震防災人數統計</div></div>
            <form id="main-form" onsubmit="handleFinalSubmit(event)">
                <div class="form-card"><label>電子郵件 (選填)</label><input type="email" id="email"></div>
                <div class="form-card"><label>班級 *</label><select id="class_name" required><option value="" disabled selected>請選擇</option></select></div>
                <div class="form-card"><label>已請假人數 *</label><input type="number" id="leave_count" required min="0"></div>
                <div class="form-card"><label>未到校人數 *</label><input type="number" id="absent_count" required min="0"></div>
                <div class="form-card"><label>失蹤學生座號</label><input type="text" id="missing_seats"></div>
                <button type="submit" class="btn-submit" id="submit-btn">發送報表</button>
            </form>
            <div id="submit-status" style="text-align:center; padding:10px; display:none; color:green; font-weight:bold;">✓ 提交成功！</div>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzeAn6JE-EnI8ZgSHyHckTf2vWQGR-rA-NUrxuZCXeUbKZYcrUT6GVYPDhBU0QtIluD/exec"; 
        const SHEET_ID = '179cZdIStY7za1WDwqGtA302kO1Llws0NHXRW69lOfB0';
        const SHEET_NAME = '防災統計回報';
        const getDataUrl = () => `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}&t=${Date.now()}`;
        const COLUMN_HEADERS = ["班級", "男生", "女生", "應到人數", "實到人數", "已請假人數", "未到校人數", "失蹤人數", "失蹤學生名單"];

        function openTab(id) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.getElementById('tab-' + id + '-btn').classList.add('active');
            window.scrollTo(0, 0);
        }

        async function fetchSheetData() {
            document.getElementById('loading-text').style.display = 'block';
            try {
                const response = await fetch(getDataUrl());
                const text = await response.text();
                const data = parseCSV(text);
                renderStats(data);
                renderTable(data);
            } catch (e) { console.error(e); }
            finally { document.getElementById('loading-text').style.display = 'none'; }
        }

        function parseCSV(t) {
            return t.split('\n').map(row => row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/^"|"$/g, '').trim()));
        }

        function renderStats(rows) {
            const g = (r) => (rows[r-1] && rows[r-1][9]) ? rows[r-1][9] : '0';
            document.getElementById('j3-val').innerText = g(4);
            document.getElementById('j5-val').innerText = g(6);
            document.getElementById('j7-val').innerText = g(8);
            document.getElementById('j9-val').innerText = g(10);
            document.getElementById('j11-val').innerText = g(12);
        }

        // --- 表格排序與渲染 (關鍵修改) ---
        function renderTable(rows) {
            const thead = document.getElementById('table-head');
            const tbody = document.getElementById('table-body');
            thead.innerHTML = ''; tbody.innerHTML = '';
            
            const hr = document.createElement('tr');
            COLUMN_HEADERS.forEach(h => { let th = document.createElement('th'); th.innerText = h; hr.appendChild(th); });
            thead.appendChild(hr);

            // 資料處理：從試算表第 2 列開始是資料
            let dataRows = rows.slice(1, 26).filter(r => r.length > 2);

            // 根據第一欄 (假設是時間或班級排序) 進行降序排列
            // 如果您的統計回報表 A 欄是班級，通常不需要排序
            // 如果您是想依據「最新填報」排序，這需要在試算表端用公式處理或是對原始回應表排序
            // 這裡預設呈現統計後的 A1:I25

            dataRows.forEach(row => {
                let tr = document.createElement('tr');
                for (let j = 0; j < 9; j++) {
                    let td = document.createElement('td');
                    td.innerText = row[j] || '';
                    tr.appendChild(td);
                }
                tbody.appendChild(tr);
            });
        }

        async function handleFinalSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = "傳送中...";

            const params = new URLSearchParams();
            params.append("email", document.getElementById('email').value || "未填寫");
            params.append("class_name", document.getElementById('class_name').value);
            params.append("leave_count", document.getElementById('leave_count').value);
            params.append("absent_count", document.getElementById('absent_count').value);
            params.append("missing_seats", document.getElementById('missing_seats').value);

            try {
                await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: params });
                document.getElementById('submit-status').style.display = 'block';
                setTimeout(() => {
                    document.getElementById('submit-status').style.display = 'none';
                    document.getElementById('main-form').reset();
                    btn.disabled = false; btn.innerText = "發送報表";
                    openTab('report'); fetchSheetData();
                }, 1500);
            } catch (e) { alert("失敗"); btn.disabled = false; }
        }

        window.onload = () => {
            const sel = document.getElementById('class_name');
            ["一","二","三","四","五","六"].forEach(g => { 
                ["一","二","三","四"].forEach(c => { let n = `${g}年${c}班`; sel.add(new Option(n, n)); });
            });
            fetchSheetData();
        };
    </script>
</body>
</html>
